<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo Verde Floresta Escuro (baseado na variável -accent do seu tema) -->
  <rect width="512" height="512" rx="130" fill="#2c4c3b"/>
  
  <!-- Borda interna decorativa fina para dar um toque mais premium -->
  <rect x="30" y="30" width="452" height="452" rx="100" fill="none" stroke="#Fdfbf7" stroke-width="6" opacity="0.3"/>
  
  <!-- Ícone de letra "B" (de Blog) puramente serifado, garantindo compatibilidade de favicon -->
  <text x="50%" y="54%" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="340" 
        font-weight="bold" 
        font-style="italic" 
        fill="#Fdfbf7" 
        text-anchor="middle" 
        dominant-baseline="middle">
    B
  </text>
  
  <!-- Círculo de detalhe usando o verde claro do tema escuro para contraste -->
  <circle cx="380" cy="380" r="26" fill="#5ba37e" />
</svg>
