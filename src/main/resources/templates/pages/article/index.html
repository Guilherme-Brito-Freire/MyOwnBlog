<!DOCTYPE html>
<html lang="pt-br" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:insert="~{fragments/header}" ><title>IMPORTER HEAD</title></head>

<body hx-headers='js:{"X-CSRF-TOKEN": document.querySelector("meta[name=\"_csrf\"]").getAttribute("content")}'>

<div th:insert="~{fragments/navbar}" ></div>

<div class="container">

    <div class="top-action" sec:authorize="hasRole('ROLE_ADMIN')">
        <button type="button" class="btn" th:hx-delete="@{/article/remove(articleId=${article.id})}" hx-swap="none"> Deletar Post </button>
    </div>

    <h1 th:text="${article.name}"></h1>
    <h2 th:text="${article.description}"></h2>
    <p th:text="${article.content}">

    </p>

    <!--HTMX IMPORT-->
    <!--suppress HtmlUnknownTarget -->
    <script src="public/htmx.js"></script>

</div>

</body>
</html>
