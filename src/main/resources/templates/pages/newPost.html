<!DOCTYPE html>
<html lang="pt-br" xmlns:th="https://www.thymeleaf.org">
<head th:insert="~{fragments/header}" ><title>IMPORTER HEAD</title></head>

<body>

<div th:insert="~{fragments/navbar}" ></div>

<div class="container">
    <div class="form-control">
        <form th:action="@{/admin/add}" method="post">

            <h2>Escreva Aqui o seu Post: </h2>

            <input type="text" name="name" placeholder="Título" required>
            <textarea name="content" placeholder="Conteúdo..." required></textarea>

            <div class="form-actions">
                <button type="submit">Criar Post</button>
                <a th:href="@{/}" class="nav-control">Voltar</a>
            </div>
            
        </form>
    </div>
</div>

</body>
</html>
